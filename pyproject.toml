[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kickedge"
version = "0.1.0"
description = "Auditable historical NFL kicker labels from nflverse"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kickedge = "kickedge.cli:main"

[tool.setuptools.packages.find]
include = ["kickedge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
