# Render Blueprint: one Python web service. No secret values live here.
services:
  - type: web
    name: kickedge
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.lock.txt && pip install --no-deps .
    startCommand: uvicorn kickedge.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      # Optional market context. Set the value in the Render dashboard only.
      - key: PARLAY_API_KEY
        sync: false
